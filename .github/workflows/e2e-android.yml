# GitHub Actions workflow for Android E2E tests
# This workflow runs WebdriverIO/Appium tests on Android devices

name: Android E2E Tests

on:
  push:
    branches: [ main, feature/mobile ]
    paths:
      - 'src-tauri/gen/android/**'
      - 'tests/e2e/android/**'
      - 'wdio.conf.ts'
  pull_request:
    branches: [ main ]
    paths:
      - 'src-tauri/gen/android/**'
      - 'tests/e2e/android/**'
      - 'wdio.conf.ts'
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm ci

    - name: Build Android APK
      run: |
        cd src-tauri
        npm run tauri android build -- --apk

    - name: Setup Appium
      run: |
        npm install -g appium@next
        appium driver install uiautomator2

    - name: Start Appium Server
      run: |
        appium &
        sleep 5

    - name: Setup Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        profile: pixel_6
        script: |
          adb devices
          ./scripts/run-e2e-tests.sh --suite launch

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: screenshots/
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          wdio-logs/
          screenshots/
        retention-days: 7

  device-farm-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run on AWS Device Farm
      # This would require AWS Device Farm setup
      run: echo "Device Farm integration coming soon"

    - name: Run on BrowserStack
      # This would require BrowserStack setup
      run: echo "BrowserStack integration coming soon"
