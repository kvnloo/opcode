name: Mobile Build

on:
  push:
    branches:
      - main
      - feature/mobile
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches:
      - main
      - feature/mobile
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build Android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Android APK (Debug)
        if: matrix.variant == 'debug'
        run: tauri android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build Android APK/AAB (Release)
        if: matrix.variant == 'release'
        run: tauri android build --apk --aab
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact (Debug)
        if: matrix.variant == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 7

      - name: Upload APK artifact (Release)
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact (Release)
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: src-tauri/gen/android/app/build/outputs/bundle/*/*.aab
          retention-days: 30

  build-ios:
    name: Build iOS (${{ matrix.variant }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            src-tauri/gen/apple/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Node dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Build iOS App (Debug)
        if: matrix.variant == 'debug'
        run: tauri ios build --debug
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build iOS App (Release)
        if: matrix.variant == 'release'
        run: tauri ios build
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload iOS App artifact (Debug)
        if: matrix.variant == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-debug
          path: src-tauri/gen/apple/build/*/Debug-iphoneos/*.app
          retention-days: 7

      - name: Upload IPA artifact (Release)
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: src-tauri/gen/apple/build/*.ipa
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-android.result }}" != "success" ] || [ "${{ needs.build-ios.result }}" != "success" ]; then
            echo "::error::One or more builds failed"
            exit 1
          fi
          echo "✅ All builds completed successfully"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate build report
        run: |
          echo "# Build Report" > build-report.md
          echo "" >> build-report.md
          echo "**Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "" >> build-report.md
          echo "## Artifacts" >> build-report.md
          find artifacts -type f -exec ls -lh {} \; | awk '{print "- " $9 " (" $5 ")"}' >> build-report.md
          cat build-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          retention-days: 30
