name: ✨ Mobile Feature Request
description: Suggest a new feature for the mobile app
title: "[Mobile Feature]: "
labels: ["enhancement", "mobile", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for the Opcode mobile app!
        Please fill out the form below to help us understand your request.

  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      description: Which platform(s) should this feature be available on?
      options:
        - Both iOS and Android
        - Android only
        - iOS only
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - Critical (blocking my workflow)
        - High (would significantly improve my experience)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your specific use case for this feature
      placeholder: |
        When I'm working on..., I need to..., so that I can...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I've tried... but it doesn't work because...

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Design Ideas
      description: If you have any mockups, sketches, or design ideas, please share them here
      placeholder: Drag and drop images here or paste image URLs

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this feature fall into?
      options:
        - UI/UX Improvement
        - New Functionality
        - Performance Enhancement
        - Accessibility
        - Developer Experience
        - Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: user-impact
    attributes:
      label: User Impact
      description: Who would benefit from this feature and how?
      placeholder: |
        - Who: All mobile users / Power users / Specific workflow users
        - How: This would help them...
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Implementation Complexity (if known)
      description: Do you have a sense of how complex this might be to implement?
      options:
        - Not sure
        - Simple (small UI change)
        - Medium (new feature with existing patterns)
        - Complex (requires new infrastructure)
        - Very complex (major architectural changes)

  - type: textarea
    id: technical-details
    attributes:
      label: Technical Details
      description: If you have technical implementation ideas, please share them here
      placeholder: |
        This could be implemented by...
        Required dependencies:...
        API changes needed:...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in contributing to this feature?
      options:
        - label: I would like to implement this feature myself
        - label: I can help with testing
        - label: I can help with design/mockups
        - label: I can help with documentation

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature request
      placeholder: |
        Similar features in other apps:
        - App X does this by...

        Related issues: #123, #456

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing feature requests to ensure this is not a duplicate
          required: true
        - label: I have provided a clear description of the problem and proposed solution
          required: true
        - label: This feature aligns with the project's goals and scope
          required: false
